# -----------------------------------------------
# LOCAL Profile - Dual Datasource
# Car  -> PostgreSQL
# Bike -> MySQL
# -----------------------------------------------

# PostgreSQL (Car) - HikariCP binds directly from datasource.car.hikari.*
datasource.car.hikari.jdbc-url=jdbc:postgresql://localhost:5432/devdb
datasource.car.hikari.driver-class-name=org.postgresql.Driver
datasource.car.hikari.username=postgres
datasource.car.hikari.password=postgres

# JPA settings for Car
datasource.car.jpa.ddl-auto=update
datasource.car.jpa.dialect=org.hibernate.dialect.PostgreSQLDialect
datasource.car.jpa.show-sql=true

# MySQL (Bike) - HikariCP binds directly from datasource.bike.hikari.*
datasource.bike.hikari.jdbc-url=jdbc:mysql://localhost:3306/testdb
datasource.bike.hikari.driver-class-name=com.mysql.cj.jdbc.Driver
datasource.bike.hikari.username=root
datasource.bike.hikari.password=123456

# JPA settings for Bike
datasource.bike.jpa.ddl-auto=update
datasource.bike.jpa.dialect=org.hibernate.dialect.MySQLDialect
datasource.bike.jpa.show-sql=true

# General
spring.jpa.open-in-view=false

# Vehicle bean config
vehicle.car.type=Ford
vehicle.bike.type=Yamaha


debug = true