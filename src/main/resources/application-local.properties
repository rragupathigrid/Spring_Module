# MySQL (Bike)
datasource.bike.url=jdbc:mysql://localhost:3306/testdb
datasource.bike.driver-class-name=com.mysql.cj.jdbc.Driver
datasource.bike.username=root
datasource.bike.password=123456

# JPA settings for Bike (MySQL)
datasource.bike.jpa.ddl-auto=update
datasource.bike.jpa.dialect=org.hibernate.dialect.MySQLDialect
datasource.bike.jpa.show-sql=true

# General
spring.jpa.open-in-view=false

